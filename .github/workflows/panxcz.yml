name: PanxCZ Kernel Build

# Drives scripts/build-panxcz.sh, which does the whole pipeline:
#   AOSP manifest (build/ + prebuilts)
#     -> MillenniumOSS `millennium/chihiro-main` @ 2a6271bf1f5b (already 5.10.269,
#        so no AOSP LTS merge is needed - that merge is what bootlooped v10/v11)
#     -> BBRv3 (patches/bbrv3-chihiro.patch) [off by default, see below]
#     -> BakaSU (SUSFS is a first-class hook method there: CONFIG_KSU_SUSFS)
#     -> simonpunk's SUSFS kernel-side patch (fs/susfs.c + the ksu_handle_* hooks)
#     -> LTO=thin build -> Image + AnyKernel3 zip
#
# BBRv3 defaults to `no` here on purpose: it is compiled in but not the default
# congestion control, and the chihiro lineage already has a pstore Oops in
# bbr3_main on record. Get a kernel that boots first, then turn it back on.
#
# Keeping the logic in the script (not in YAML) is deliberate: the same script
# runs on the VPS, so CI and local builds cannot drift apart.
#
# This repo holds only the build system; the kernel source is fetched by the
# script itself, so the checkout here is tiny.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant'
        required: true
        default: 'A-full-allin'
        type: choice
        options: [A-full-allin, B-susfs-hiding, C-charging-gaming]
      kernel_release:
        description: 'Kernel release (used in the version string)'
        required: true
        default: '4.0'
      lto:
        description: 'LTO mode'
        required: true
        default: 'thin'
        type: choice
        options: [thin, none, full]
      bbrv3:
        description: 'BBRv3: yes = fail the build if it cannot be applied'
        required: true
        default: 'no'
        type: choice
        # Unquoted yes/no are YAML 1.1 booleans, so the dropdown silently became
        # [true, auto, false] and the script's string compares (`= "no"`)
        # could never match - quoting keeps these as the literal strings the
        # build script actually tests against.
        options: ['yes', 'auto', 'no']
      lts_merge:
        description: 'LEGACY ONLY: merge AOSP LTS onto the old repo (leave `no`)'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']
      publish_release:
        description: 'Publish a GitHub release with the artifacts'
        required: true
        default: true
        type: boolean
  push:
    branches: [main, panxcz]
    paths:
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/panxcz.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The kernel tree + AOSP prebuilts need far more than the ~25 GB a stock
      # runner leaves free.
      #
      # NOTE: easimon/maximize-build-space is deliberately NOT used here. It
      # shrinks the root LV and mounts a fresh volume *on top of the checkout
      # path*, so a repository that was checked out before it silently vanishes
      # (that is exactly how the first run died with
      # "bash: scripts/build-panxcz.sh: No such file or directory"). Plain
      # deletion of the preinstalled toolchains frees ~35 GB with no mounts.
      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Show runner
        run: |
          nproc; free -h; df -h /
          # Prove the checkout really is here before spending 30 minutes.
          ls -l scripts/build-panxcz.sh patches/bbrv3-chihiro.patch

      - name: Build
        env:
          VARIANT: ${{ inputs.variant || 'A-full-allin' }}
          KERNEL_RELEASE: ${{ inputs.kernel_release || '4.0' }}
          LTO_MODE: ${{ inputs.lto || 'thin' }}
          BBRV3: ${{ inputs.bbrv3 || 'no' }}
          LTS_MERGE: ${{ inputs.lts_merge || 'no' }}
          # Pin the live tree explicitly so a stale runner cache or a changed
          # script default can never silently fall back to the legacy repo.
          BASE_REPO: https://github.com/MillenniumOSS/android_kernel_common_millennium_android12-5.10.git
          BASE_BRANCH: chihiro-main
          WORKDIR: /opt/panxcz
        run: |
          set -euo pipefail
          # The script expects patches/ next to scripts/, which is the case here.
          sudo -E bash scripts/build-panxcz.sh
          echo "--- verification (must not be empty) ---"
          O=/opt/panxcz/gki/out/android12-5.10/common
          probes="susfs"
          [ "${BBRV3}" = "no" ] || probes="bbr3 susfs"
          for p in $probes; do
            n=$(grep -ic "$p" "$O/System.map" || true)
            echo "$p symbols: $n"
            [ "$n" -gt 0 ] || { echo "::error::$p missing from System.map"; exit 1; }
          done
          grep -q '^CONFIG_KSU_SUSFS=y' "$O/.config"
          # The base must be 5.10.269 from chihiro-main, not a merged legacy tree.
          echo -n "base LTS level: "
          awk '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/{printf "%s.",$3}END{print ""}' \
            /opt/panxcz/gki/common/Makefile
          grep '^CONFIG_LOCALVERSION=' "$O/.config" || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp -f /opt/panxcz/out-artifacts/Image dist/ || true
          cp -f /opt/panxcz/out-artifacts/*.zip dist/ || true
          cp -f /opt/panxcz/out-artifacts/summary.txt dist/ || true
          cp -f /opt/panxcz/gki/out/android12-5.10/common/System.map dist/ || true
          cp -f /opt/panxcz/gki/out/android12-5.10/common/.config dist/config.txt || true
          ls -lh dist

      - name: Show summary
        run: cat dist/summary.txt 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PanxCZ-${{ inputs.kernel_release || '4.0' }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        if: ${{ (inputs.publish_release == true) || (github.event_name == 'push') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panxcz-${{ inputs.kernel_release || '4.0' }}-${{ github.run_number }}
          name: PanxCZ ${{ inputs.kernel_release || '4.0' }} (5.10.269, KMI gen 9)
          body: |
            PanxCZ kernel for the Infinix Note 30 (X6833B) — MediaTek Helio G99 (MT6789).

            Base: MillenniumOSS Chihiro **`millennium/chihiro-main`**
            @ `2a6271bf1f5b` → **5.10.269**, KMI generation 9. No AOSP LTS merge
            (the hand-merged legacy tree bootlooped v10/v11).
            Root: BakaSU (multi-manager) · Hiding: SUSFS.

            Credit: kernel work belongs to MillenniumOSS (Chihiro), Aetherium
            (kaminarich), BakaSU, SUSFS and upstream Linux/AOSP. PanxCZ is a
            rebrand + integration layer only.
          files: dist/*
          fail_on_unmatched_files: false
